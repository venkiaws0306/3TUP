name: Enterprice Devsecops for QA
on:
  push:
    branches: 
    - qa
    paths: 
     - client/**
     - server/**
     - .github/workflows/qa-cicd.yml
jobs:
  gitleaks-scan:
   name: gitleaks-scan
   runs-on: ubuntu-latest
   steps:
     - name: checkout Sourcecode 
       uses: actions/checkout@v4

     - name: Run Gitleaks Sacn
       run: | 
         docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0 
            
     - name: Upload Gitleaks report
       uses: actions/upload-artifact@v4
       with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Terraform scan
        run: |
          checkov -d . \
            --framework terraform \
            --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn
